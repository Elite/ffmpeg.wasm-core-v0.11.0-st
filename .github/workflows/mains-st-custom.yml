name: Custom build- > Build FFmpeg.wasm (Single Thread)
on:
  push:
    branches:
      - n4.3.1-wasm
  pull_request:
    branches:
      - n4.3.1-wasm

env:
  FFMPEG_ST: yes
  DIST_PATH: wasm/packages/core-st/dist
  CACHE_KEY_PREFIX: ffmpeg.wasm-core-st
  EM_VERSION: 2.0.8  # Uncommented and set to exact version
  EM_CACHE_FOLDER: 'emsdk-cache'
  FFMPEG_COMMIT: 3ea4213  # Pin to exact commit

jobs:
  build-libs:
    strategy:
      max-parallel: 1
      matrix:
        script:
          - build-zlib
          - build-x264
          - build-x265
          - build-libvpx
          - build-wavpack
          - build-lame
          - build-fdk-aac
          - build-ogg
          - build-vorbis
          - build-theora
          - build-opus
          - build-libwebp
          - build-freetype2
          - build-fribidi
          - build-harfbuzz
          - build-libass
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4  # Updated
        with:
          repository: ffmpegwasm/ffmpeg.wasm-core  # Correct repo
          ref: ${{ env.FFMPEG_COMMIT }}  # Specific commit
          submodules: recursive
      
      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v11
        with:
          version: ${{ env.EM_VERSION }}
          actions-cache-folder: ${{ env.EM_CACHE_FOLDER }}
      
      - name: Cache libs
        uses: actions/cache@v3  # CHANGED: v2 -> v3
        with:
          path: |
            build
            wasm/cache
          key: ${{ env.CACHE_KEY_PREFIX }}-${{ env.FFMPEG_COMMIT }}-${{ matrix.script }}
          restore-keys: |
            ${{ env.CACHE_KEY_PREFIX }}-${{ env.FFMPEG_COMMIT }}-
      
      - name: List cached libs
        run: ls -R build || true
      
      - name: Build FFMpeg Libs
        run: bash build-with-docker.sh install-deps ${{ matrix.script }}

  build-ffmpeg:
    runs-on: ubuntu-latest
    needs: build-libs
    steps:
      - uses: actions/checkout@v4  # Updated
        with:
          repository: ffmpegwasm/ffmpeg.wasm-core  # Correct repo
          ref: ${{ env.FFMPEG_COMMIT }}  # Specific commit
          submodules: recursive
      
      - name: Setup Emscripten
        uses: mymindstorm/setup-emsdk@v11
        with:
          version: ${{ env.EM_VERSION }}
          actions-cache-folder: ${{ env.EM_CACHE_FOLDER }}
      
      - name: Cache multiple paths
        uses: actions/cache@v3  # CHANGED: v2 -> v3
        with:
          path: |
            build
            wasm/cache
          key: ${{ env.CACHE_KEY_PREFIX }}-${{ env.FFMPEG_COMMIT }}-ffmpeg
          restore-keys: |
            ${{ env.CACHE_KEY_PREFIX }}-${{ env.FFMPEG_COMMIT }}-
      
      - name: List cached libs
        run: ls -R build || true
      
      - name: Build FFMpeg
        run: |
          bash build-with-docker.sh \
            install-deps \
            configure-ffmpeg \
            build-ffmpeg
      
      - uses: actions/upload-artifact@v3  # Updated
        with:
          name: ffmpeg-core
          path: ${{ env.DIST_PATH }}
